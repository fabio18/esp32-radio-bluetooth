; PlatformIO Project Configuration
; ESP32 Radio Bluetooth com Alexa
; Componentes: ESP32 DevKit + TEA5767 + ILI9341 TFT 2.4" (Touch XPT2046)

[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Partição customizada para suportar Bluetooth + OTA
board_build.partitions = huge_app.csv

lib_deps =
    bodmer/TFT_eSPI@^2.5.34
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.0
    fastled/FastLED@^3.6.0

build_flags =
    ; === ILI9341 TFT Display Configuration (TFT_eSPI) ===
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    ; SPI Pins (Display)
    -DTFT_MOSI=23
    -DTFT_MISO=19
    -DTFT_SCLK=18
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=4
    ; === XPT2046 Touch Configuration ===
    -DTOUCH_CS=27
    ; SPI Frequency
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    ; Smooth fonts
    -DSMOOTH_FONT=1
    ; Bluetooth
    -DCONFIG_BT_ENABLED=1
    -DCONFIG_BLUEDROID_ENABLED=1
